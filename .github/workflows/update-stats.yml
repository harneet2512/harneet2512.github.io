name: Refresh GitHub stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual run

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-stats.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "harneet2512"
          git config user.email "62827797+harneet2512@users.noreply.github.com"
          git add src/data/github-stats.json
          git commit -m "chore: refresh github stats [skip ci]"
          git push
